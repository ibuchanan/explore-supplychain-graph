modules:
  graph:connector:
    - key: workdown-documents
      name: Workdown
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: true
      icons:
        light: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
        dark: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      objectTypes:
        - atlassian:document
      datasource:
        onConnectionChange:
          function: graph-connection
  webtrigger:
    - key: explore-supplychain-graph-webtrigger-sync
      function: sync
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
    - key: explore-supplychain-graph-webtrigger-async
      function: async
      urlFormat: v2
      request:
        authentication: none
      response:
        type: dynamic
  trigger:
    - key: workdown-jira-changes
      function: jira-change
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
  function:
    - key: jira-change
      handler: jira-trigger.onJiraChange
    - key: graph-connection
      handler: graph.onGraphConnectionChange
    - key: sync
      handler: index.runSync
    - key: async
      handler: index.runAsync
permissions:
  scopes:
    storage:app: {}
    write:object:jira: {}
    read:object:jira: {}
    delete:object:jira: {}
    read:jira-work:
      allowImpersonation: true
  external:
    fetch:
      backend:
        - address: https://api.atlassian.com
app:
  storage:
    entities:
      - name: exchange-document
        attributes:
          version:
            type: string
          payload:
            type: any
          publication:
            type: string
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/dafd6b90-4561-4a15-960f-758ff81672cd

[project]
name = "explore-supplychain-graph"
revision = "1.0"

[profiles.default]
# Local controls: where and how `forge` commands operate. They are not app
# secrets; Fence Rider reads them to target the opt-in `forge:*` scripts.
# `providers` names a storage role, not a backend: each developer or CI
# operator binds `shared_config` to a backend in their own SecretSpec config.
# Use `project_config` instead if a target must not follow other projects.
[profiles.default.FORGE_SITE]
description = "Forge site hostname, e.g. example.atlassian.net"
required = true
providers = ["shared_config"]

[profiles.default.FORGE_PRODUCT]
description = "Forge product (jira, confluence, bitbucket)"
default = "jira"
providers = ["shared_config"]

[profiles.default.FORGE_ENVIRONMENT]
description = "Forge environment name (development, staging, production)"
default = "development"
providers = ["shared_config"]

# Optional local test inputs, never runtime or manifest variables.
[profiles.default.WORKDOWN_RPC_URL]
description = "Webtrigger URL of the approved development installation"
required = false
providers = ["project_secrets"]

[profiles.default.WORKDOWN_TEST_EMAIL]
description = "Email of the Jira-admin test user"
required = false
providers = ["project_config"]

[profiles.default.WORKDOWN_TEST_API_TOKEN]
description = "Scoped Jira API token of the Jira-admin test user"
required = false
providers = ["project_secrets"]

[profiles.default.WORKDOWN_TEST_ISSUE]
description = "Readable Epic with an empty or plain-text description on the test site"
required = false
providers = ["project_config"]
